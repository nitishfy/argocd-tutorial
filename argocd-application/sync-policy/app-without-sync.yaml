apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev
  namespace: argocd
spec:
  project: default
  source:
    directory:
      recurse: true
    repoURL: https://github.com/nitishfy/argocd-tutorial.git
    path: argocd-application/monorepo-annotation/manifests/dev
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated: {}  
